<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- iPad : pas de zoom, l'image va jusqu'aux bords de l'écran -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Ajouté à l'écran d'accueil de l'iPad, le jeu s'ouvre sans la barre de Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Max Réacteur">
<meta name="theme-color" content="#000000">
<title>Max Réacteur</title>
<style>
/* Ni défilement, ni rebond, ni sélection de texte, ni loupe : la page entière est le jeu. */
html, body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	position: fixed;
	inset: 0;
	overscroll-behavior: none;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	background: #000;
	color: #fff;
}
#canvas {
	display: block;
	border: 0;
	touch-action: none;
}
#canvas:focus { outline: none; }

/* Écran de chargement, aux couleurs du ciel du jeu */
#chargement {
	position: absolute;
	inset: 0;
	background: #6cc4ff;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 28px;
	font-family: -apple-system, "Segoe UI", Arial, sans-serif;
	font-weight: 800;
	z-index: 1;
}
#chargement h1 {
	margin: 0;
	font-size: min(11vw, 88px);
	color: #ffc23a;
	-webkit-text-stroke: 3px #24123d;
	paint-order: stroke fill;
	letter-spacing: 2px;
}
#chargement p { margin: 0; font-size: 24px; color: #24123d; }
#barre {
	width: min(60vw, 480px);
	height: 18px;
	border: 3px solid #24123d;
	border-radius: 12px;
	background: #f3e2b3;
	overflow: hidden;
}
#barre div { width: 0; height: 100%; background: #ff8c1a; transition: width 0.2s; }
#erreur { display: none; max-width: 80vw; text-align: center; font-weight: 600; color: #24123d; }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas">Ce navigateur ne sait pas afficher le jeu.</canvas>
<noscript>JavaScript doit être activé pour jouer.</noscript>

<div id="chargement">
	<h1>MAX RÉACTEUR</h1>
	<div id="barre"><div></div></div>
	<p id="texte">Chargement…</p>
	<p id="erreur"></p>
</div>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":504836,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	// ----- Pas de zoom ni de défilement sur l'iPad (pincer, double-toucher, glisser) -----
	const bloquer = (e) => e.preventDefault();
	document.addEventListener('touchmove', bloquer, { passive: false });
	document.addEventListener('gesturestart', bloquer);
	document.addEventListener('gesturechange', bloquer);
	document.addEventListener('dblclick', bloquer);
	document.addEventListener('contextmenu', bloquer);

	// ----- Plein écran et son, au moment d'un toucher (Safari ne les accepte qu'à ce moment-là) -----
	// Le jeu dit quand c'est permis (window.mrPleinEcran, sur l'accueil et les résultats) : jamais en pleine partie.
	function auToucher() {
		try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* non pris en charge */ }
		if (!window.mrPleinEcran) return;
		const d = document.documentElement;
		if (document.fullscreenElement || document.webkitFullscreenElement) return;
		try {
			const p = d.requestFullscreen ? d.requestFullscreen({ navigationUI: 'hide' }) : (d.webkitRequestFullscreen ? d.webkitRequestFullscreen() : null);
			if (p && p.catch) p.catch(() => {});
		} catch (e) { /* plein écran refusé : le jeu marche quand même */ }
	}
	document.addEventListener('touchend', auToucher, true);
	document.addEventListener('mouseup', auToucher, true);

	// ----- Chargement -----
	const ecran = document.getElementById('chargement');
	const barre = document.querySelector('#barre div');
	const texte = document.getElementById('texte');
	const erreur = document.getElementById('erreur');

	function montrerErreur(msg) {
		console.error(msg);
		texte.style.display = 'none';
		document.getElementById('barre').style.display = 'none';
		erreur.style.display = 'block';
		erreur.textContent = 'Le jeu ne peut pas démarrer : ' + (msg instanceof Error ? msg.message : msg);
	}

	const manque = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (manque.length !== 0) {
		montrerErreur('ce navigateur n\'a pas tout ce qu\'il faut (' + manque.join(', ') + ').');
		return;
	}
	engine.startGame({
		onProgress: function (actuel, total) {
			if (actuel > 0 && total > 0) barre.style.width = Math.round((actuel / total) * 100) + '%';
		},
	}).then(() => {
		ecran.remove();
	}, montrerErreur);
}());
</script>
</body>
</html>
